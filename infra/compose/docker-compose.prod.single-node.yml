services:
  postgres:
    image: postgres:16-alpine@sha256:23e88eb049fd5d54894d70100df61d38a49ed97909263f79d4ff4c30a5d5fca2
    container_name: vibe-creator-db-prod
    env_file:
      - .env.docker.infra
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    container_name: vibe-creator-redis-prod
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  transcribe:
    build:
      context: ../../apps/transcribe-service
      dockerfile: Dockerfile
      args:
        INSTALL_DIARIZATION: ${TRANSCRIBE_INSTALL_DIARIZATION:-false}
    image: vibe-creator-transcribe:${IMAGE_TAG:-latest}
    container_name: vibe-creator-transcribe-prod
    env_file:
      - apps/api/.env.docker
    environment:
      TRANSCRIBE_ALLOWED_ROOTS: /app/uploads
      HF_HOME: /app/uploads/cache/huggingface
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-mixed}
      TRANSCRIBE_DIARIZATION_ENABLED: ${TRANSCRIBE_DIARIZATION_ENABLED:-false}
      TRANSCRIBE_DIARIZATION_MODEL: ${TRANSCRIBE_DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      TRANSCRIBE_DIARIZATION_DEVICE: ${TRANSCRIBE_DIARIZATION_DEVICE:-cpu}
      TRANSCRIBE_VAD_THRESHOLD: ${TRANSCRIBE_VAD_THRESHOLD:-0.5}
      TRANSCRIBE_VAD_SPEECH_PAD_MS: ${TRANSCRIBE_VAD_SPEECH_PAD_MS:-300}
      TRANSCRIBE_VAD_MIN_SILENCE_MS: ${TRANSCRIBE_VAD_MIN_SILENCE_MS:-200}
      TRANSCRIBE_VAD_MIN_SPEECH_MS: ${TRANSCRIBE_VAD_MIN_SPEECH_MS:-80}
    volumes:
      - api_uploads_prod:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runner
    image: vibe-creator-api:${IMAGE_TAG:-latest}
    container_name: vibe-creator-api-prod
    ports:
      - "80:3000"
    env_file:
      - apps/api/.env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/vibe_creator?schema=public
      REDIS_URL: redis://redis:6379
      FFMPEG_PATH: /usr/bin/ffmpeg
      MEDIA_INPUT_DIR: /app/uploads
      TEMP_DIR: /app/uploads/temp
      OUTPUT_DIR: /app/uploads/exports
      TRANSCRIBE_PROVIDER: http
      TRANSCRIBE_SERVICE_URL: http://transcribe:8000
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-mixed}
    volumes:
      - api_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      transcribe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 512M

  export-worker:
    image: vibe-creator-api:${IMAGE_TAG:-latest}
    container_name: vibe-creator-export-worker-prod
    command: ["node", "dist/workers/export.worker.js"]
    env_file:
      - apps/api/.env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/vibe_creator?schema=public
      REDIS_URL: redis://redis:6379
      FFMPEG_PATH: /usr/bin/ffmpeg
      MEDIA_INPUT_DIR: /app/uploads
      TEMP_DIR: /app/uploads/temp
      OUTPUT_DIR: /app/uploads/exports
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-1}
      EXPORT_QUEUE_MAX_PENDING: ${EXPORT_QUEUE_MAX_PENDING:-50}
      TRANSCRIBE_PROVIDER: http
      TRANSCRIBE_SERVICE_URL: http://transcribe:8000
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-mixed}
    volumes:
      - api_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      transcribe:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data_prod:
  redis_data_prod:
  api_uploads_prod:
