# ━━━ AI Project Contract ━━━
# AI MUST read this file at the start of every conversation.
# DO NOT delete or modify without developer permission.
# This file is generated by /new-project or /adopt workflow.

contract_version: 1

project:
  name: "vibe-creator"
  description: "Fullstack monorepo for AI-assisted content creation, video editing, prompt building, and creator workflow tooling."

profile: "FB"
architecture: "monorepo"
tier: "STANDARD"

features:
  - "web-spa"
  - "fastify-api"
  - "authentication"
  - "admin-dashboard"
  - "project-management"
  - "prompt-builder"
  - "trending-analysis"
  - "ai-director"
  - "story-director"
  - "video-editor"
  - "reaction-creator"
  - "loop-creator"
  - "livestream-tools"
  - "uploads-downloads"
  - "media-processing"
  - "background-jobs"
  - "billing-payments"

deploy:
  target: "single-node-vps"
  runtime: "docker-compose"
  reverse_proxy: "nginx"
  services:
    - "web"
    - "api"
    - "postgres"
    - "redis"
  notes:
    - "Production deployment is documented around a single-node VPS flow."
    - "API, PostgreSQL, and Redis are defined in Docker Compose production manifests."

active_modules:
  - "1.1"
  - "1.2"
  - "2.1"
  - "2.2"
  - "2.3"
  - "3.1"
  - "4.1"
  - "6.1"
  - "7.1"
  - "8.1"
  - "9.1"

quality_gates:
  require_tests_on_logic_change: true
  require_zod_validation: true
  require_type_safety: true
  require_biome_clean: true
  require_build_pass: true
