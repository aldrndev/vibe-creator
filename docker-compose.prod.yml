services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-creator-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vibe_creator
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vibe-creator-redis-prod
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
    container_name: vibe-creator-server-prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vibe_creator
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # FFmpeg config
      FFMPEG_PATH: /usr/bin/ffmpeg
      MEDIA_INPUT_DIR: /app/uploads
      TEMP_DIR: /app/uploads/temp
      OUTPUT_DIR: /app/uploads/exports
    volumes:
      - server_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  server_uploads_prod:
