services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-creator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vibe_creator
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibe-creator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
    container_name: vibe-creator-server
    ports:
      - "3000:3000"
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vibe_creator
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # FFmpeg config
      FFMPEG_PATH: /usr/bin/ffmpeg
      MEDIA_INPUT_DIR: /app/uploads
      TEMP_DIR: /app/uploads/temp
      OUTPUT_DIR: /app/uploads/exports
      COBALT_API_URL: http://cobalt:9000
    volumes:
      - server_uploads:/app/uploads
      # HOT RELOAD MAPPINGS
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/tsconfig.json:/app/apps/server/tsconfig.json
      - ./apps/server/package.json:/app/apps/server/package.json
      - ./packages/shared/src:/app/packages/shared/src
      # Prevent host node_modules from breaking container
      - /app/apps/server/node_modules
      - /app/node_modules
    # Command defined in Dockerfile dev stage, but we can keep it explicit or remove
    # Default is: CMD ["pnpm", "--filter", "@vibe-creator/server", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cobalt:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits for FFmpeg export safety
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 512M

  # Self-hosted Cobalt API for YouTube/TikTok/Instagram video downloads
  cobalt:
    image: ghcr.io/imputnet/cobalt:10
    container_name: vibe-creator-cobalt
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # API mode (api only, no web interface)
      API_URL: "http://localhost:9000"
      # Disable authentication for internal use
      API_AUTH_REQUIRED: "0"
      # Quality settings
      QUALITY: "1080"
      # Enable all services
      YOUTUBE_ENABLED: "1"
      TIKTOK_ENABLED: "1"
      TWITTER_ENABLED: "1"
      INSTAGRAM_ENABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  server_uploads:
